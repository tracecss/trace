<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Switch</title>
    <script src="./playground.js"></script>
    <link rel="stylesheet" href="../src/index.css" />
    <link rel="stylesheet" href="./layout.css" />
  </head>
  <body>
    <header>
      <a href="./index.html">Home</a>
      <a href="./all.html">All components</a>
    </header>
    <main data-theme-preview>
      <div data-mode="light" aria-label="Light theme">
        <h3>Classless</h3>
        <div data-form-examples>
          <label><input type="checkbox" role="switch" /> Off</label
          ><label><input type="checkbox" role="switch" checked /> On</label
          ><label
            ><input type="checkbox" role="switch" disabled /> Disabled</label
          ><label
            ><input type="checkbox" role="switch" checked disabled /> On and
            disabled</label
          ><label
            ><input type="checkbox" role="switch" aria-invalid="true" />
            Invalid</label
          >
        </div>
        <h3>Extensions</h3>
        <div data-form-examples>
          <label
            ><input type="checkbox" role="switch" class="trace-small" />
            Small</label
          ><label
            ><input type="checkbox" role="switch" class="trace-large" />
            Large</label
          ><label
            ><span class="trace-switch"
              ><input type="checkbox" role="switch" /><span
                class="trace-icon"
                aria-hidden="true"
                ><svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <rect x="4" y="4" width="16" height="16" rx="2" />
                  <path d="M8 9h8M8 14h5" /></svg></span
            ></span>
            With icon</label
          >
        </div>
        <h3>Arabic / RTL</h3>
        <section lang="ar" dir="rtl" aria-label="أمثلة باللغة العربية">

              صالح</label
